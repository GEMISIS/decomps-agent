    PRG28: load = PRG28, type = ro, optional = yes;
    PRG29: load = PRG29, type = ro, optional = yes;

    PRG30:    load = PRGFIX0, type = ro,  optional = yes;   # fixed at $C000
    LOWCODE:  load = PRGFIX0, type = ro,  optional = yes;
    RODATA:   load = PRGFIX0, type = ro,  define = yes;
    DATA:     load = PRGFIX0, run = RAM, type = rw, define = yes;

    STARTUP:  load = PRGFIX1, type = ro,  define = yes;      # fixed at $E000
    ONCE:     load = PRGFIX1, type = ro,  optional = yes;
