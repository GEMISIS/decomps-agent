# ld65 configuration - MMC3 / TxROM (mapper 4): 32 x 8 KB PRG (256 KB), 32 x 8 KB CHR-ROM (256 KB),
# 8 KB PRG-RAM at $6000.
# PRG mode 0: PRG0..PRG29 switchable in two 8 KB slots ($8000 and $A000),
# PRG30 fixed at $C000-$DFFF, PRG31 fixed at $E000-$FFFF (vectors).
# CHR is 1 KB-granular on the hardware; each CHRn here is an 8 KB block (8 x 1 KB banks).
# Adapted from the cc65 project's nes.cfg (cc65 is distributed under the zlib license).
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
}
MEMORY {
    ZP:      file = "", start = $0002, size = $00FE, type = rw, define = yes;
    STACK:   file = "", start = $0100, size = $0100, type = rw;
    OAMPAGE: file = "", start = $0200, size = $0100, type = rw, define = yes;
    RAM:     file = "", start = $0300, size = $0400, type = rw, define = yes;
    SRAM:    file = "", start = $0700, size = __STACKSIZE__, define = yes;
    WRAM:    file = "", start = $6000, size = $2000, type = rw, define = yes;

    HEADER:  file = %O, start = $0000, size = $0010, fill = yes;
    PRG0:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG1:    file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG2:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG3:    file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG4:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG5:    file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG6:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG7:    file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG8:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG9:    file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG10:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG11:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG12:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG13:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG14:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG15:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG16:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG17:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG18:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG19:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG20:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG21:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG22:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG23:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG24:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG25:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG26:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG27:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRG28:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PRG29:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PRGFIX0: file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF, define = yes;
    PRGFIX1: file = %O, start = $E000, size = $1FFA, fill = yes, fillval = $FF, define = yes;
    ROMV:    file = %O, start = $FFFA, size = $0006, fill = yes;

    CHR0:  file = %O, start = $0000, size = $2000, fill = yes;
    CHR1:  file = %O, start = $0000, size = $2000, fill = yes;
    CHR2:  file = %O, start = $0000, size = $2000, fill = yes;
    CHR3:  file = %O, start = $0000, size = $2000, fill = yes;
