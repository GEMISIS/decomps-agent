    CHR22: file = %O, start = $0000, size = $2000, fill = yes;
    CHR23: file = %O, start = $0000, size = $2000, fill = yes;
    CHR24: file = %O, start = $0000, size = $2000, fill = yes;
    CHR25: file = %O, start = $0000, size = $2000, fill = yes;
    CHR26: file = %O, start = $0000, size = $2000, fill = yes;
    CHR27: file = %O, start = $0000, size = $2000, fill = yes;
    CHR28: file = %O, start = $0000, size = $2000, fill = yes;
    CHR29: file = %O, start = $0000, size = $2000, fill = yes;
    CHR30: file = %O, start = $0000, size = $2000, fill = yes;
    CHR31: file = %O, start = $0000, size = $2000, fill = yes;
