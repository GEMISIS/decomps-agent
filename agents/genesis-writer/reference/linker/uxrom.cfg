# ld65 configuration - UxROM (mapper 2): 8 x 16 KB PRG, 8 KB CHR-RAM
# PRG0..PRG6 are switchable at $8000-$BFFF; PRG7 (last) is fixed at $C000-$FFFF.
# CHR-RAM: no CHR segment; tile data is .incbin'd into a PRG bank and uploaded at run time.
# Adapted from the cc65 project's nes.cfg (cc65 is distributed under the zlib license).
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
}
MEMORY {
    ZP:      file = "", start = $0002, size = $00FE, type = rw, define = yes;
    STACK:   file = "", start = $0100, size = $0100, type = rw;
    OAMPAGE: file = "", start = $0200, size = $0100, type = rw, define = yes;
    RAM:     file = "", start = $0300, size = $0400, type = rw, define = yes;
    SRAM:    file = "", start = $0700, size = __STACKSIZE__, define = yes;

    HEADER:  file = %O, start = $0000, size = $0010, fill = yes;
    PRG0:    file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG1:    file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG2:    file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG3:    file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG4:    file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG5:    file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRG6:    file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    PRGFIX:  file = %O, start = $C000, size = $3FFA, fill = yes, fillval = $FF, define = yes;
    ROMV:    file = %O, start = $FFFA, size = $0006, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp,  define = yes;
    OAM:      load = OAMPAGE, type = bss, define = yes, optional = yes;
    BSS:      load = RAM,     type = bss, define = yes;
    HEAP:     load = RAM,     type = bss, optional = yes;

    HEADER:   load = HEADER,  type = ro;
    PRG0:     load = PRG0,    type = ro,  optional = yes;
    PRG1:     load = PRG1,    type = ro,  optional = yes;
    PRG2:     load = PRG2,    type = ro,  optional = yes;
    PRG3:     load = PRG3,    type = ro,  optional = yes;
    PRG4:     load = PRG4,    type = ro,  optional = yes;
    PRG5:     load = PRG5,    type = ro,  optional = yes;
    PRG6:     load = PRG6,    type = ro,  optional = yes;

    STARTUP:  load = PRGFIX,  type = ro,  define = yes;
    LOWCODE:  load = PRGFIX,  type = ro,  optional = yes;
    ONCE:     load = PRGFIX,  type = ro,  optional = yes;
    INIT:     load = PRGFIX,  type = ro,  optional = yes;
    CODE:     load = PRGFIX,  type = ro,  define = yes;
    PRG7:     load = PRGFIX,  type = ro,  optional = yes;   # alias: "fixed bank"
    RODATA:   load = PRGFIX,  type = ro,  define = yes;
    DATA:     load = PRGFIX, run = RAM, type = rw, define = yes;
    VECTORS:  load = ROMV,    type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
