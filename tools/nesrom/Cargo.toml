[package]
name = "nesrom"
version = "0.1.0"
edition = "2021"
description = "Deterministic NES ROM analysis and asset extraction tool for the clean-room reimplementation pipeline"
license = "MIT"

[lib]
name = "nesrom"
path = "src/lib.rs"

[[bin]]
name = "nesrom"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"
rhai = "1"
